<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900"><title>Ключевые состояния интерфейса</title><defs><linearGradient id="shade"><stop stop-color="#0d1613" stop-opacity=".97"/><stop offset=".6" stop-color="#0d1613" stop-opacity=".42"/><stop offset="1" stop-color="#0d1613" stop-opacity="0"/></linearGradient><linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#131715" stop-opacity="0"/><stop offset="1" stop-color="#131715"/></linearGradient></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#131715" stroke="none" opacity="1"/><text x="40" y="62" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#e5ff58" >GNOM FIJI</text><text x="40" y="121" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#f5f7f4" >СОСТОЯНИЯ И ДИАЛОГИ</text><text x="40" y="171" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#a8b7af" >01 / ГОСТЕВОЙ ПРОФИЛЬ</text><rect x="40" y="188" width="480" height="276" rx="6" fill="#202623" stroke="#3b4540" opacity="1"/><circle cx="72" cy="221" r="8" fill="#e5ff58" stroke="none" stroke-width="1"/><text x="95" y="229" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f7f4" >Сохраним твой прогресс</text><text x="63" y="277" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Войди, чтобы участвовать в рейтинге</text><text x="63" y="305" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >и совершать покупки. Гостевой прогресс</text><text x="63" y="333" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >будет перенесён в аккаунт.</text><rect x="63" y="380" width="434" height="56" rx="4" fill="#e5ff58" stroke="none" opacity="1"/><text x="85" y="415" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#131715" >ВОЙТИ И ПРОДОЛЖИТЬ</text><text x="462" y="415" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#131715" >›</text><text x="560" y="171" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#a8b7af" >02 / ПОИСК СОПЕРНИКОВ</text><rect x="560" y="188" width="480" height="276" rx="6" fill="#202623" stroke="#3b4540" opacity="1"/><circle cx="592" cy="221" r="8" fill="#64e3db" stroke="none" stroke-width="1"/><text x="615" y="229" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f7f4" >Подбираем соперников · 00:18</text><text x="583" y="277" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Рейтинг: 1 280 · Мощность: 420</text><text x="583" y="305" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Ищем близких по результатам и сборке.</text><text x="583" y="333" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Свободные места займут боты.</text><rect x="583" y="380" width="434" height="56" rx="4" fill="#202623" stroke="#3b4540" opacity="1"/><text x="605" y="415" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f5f7f4" >ОТМЕНИТЬ ПОИСК</text><text x="982" y="415" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#f5f7f4" >›</text><text x="1080" y="171" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#a8b7af" >03 / СОЕДИНЕНИЕ ПОТЕРЯНО</text><rect x="1080" y="188" width="480" height="276" rx="6" fill="#202623" stroke="#3b4540" opacity="1"/><circle cx="1112" cy="221" r="8" fill="#ff877b" stroke="none" stroke-width="1"/><text x="1135" y="229" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f7f4" >Восстанавливаем соединение</text><text x="1103" y="277" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Гонка продолжается на сервере.</text><text x="1103" y="305" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Возвращаем тебя в текущий заезд.</text><text x="1103" y="333" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Попытка 2 из 3</text><rect x="1103" y="380" width="434" height="56" rx="4" fill="#202623" stroke="#3b4540" opacity="1"/><text x="1125" y="415" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f5f7f4" >ВЕРНУТЬСЯ В МЕНЮ</text><text x="1502" y="415" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#f5f7f4" >›</text><text x="40" y="515" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#a8b7af" >04 / ПУСТОЙ ИНВЕНТАРЬ</text><rect x="40" y="532" width="480" height="276" rx="6" fill="#202623" stroke="#3b4540" opacity="1"/><circle cx="72" cy="565" r="8" fill="#64e3db" stroke="none" stroke-width="1"/><text x="95" y="573" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f7f4" >Пока нет запасных деталей</text><text x="63" y="621" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Открывай детали в чемпионатах</text><text x="63" y="649" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >или выбирай их в магазине.</text><text x="63" y="677" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Установленные детали остаются на машине.</text><rect x="63" y="724" width="434" height="56" rx="4" fill="#202623" stroke="#3b4540" opacity="1"/><text x="85" y="759" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f5f7f4" >ОТКРЫТЬ МАГАЗИН</text><text x="462" y="759" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#f5f7f4" >›</text><text x="560" y="515" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#a8b7af" >05 / ОПЛАТА В ОБРАБОТКЕ</text><rect x="560" y="532" width="480" height="276" rx="6" fill="#202623" stroke="#3b4540" opacity="1"/><circle cx="592" cy="565" r="8" fill="#64e3db" stroke="none" stroke-width="1"/><text x="615" y="573" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f7f4" >Проверяем платёж</text><text x="583" y="621" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Покупка: кристалл с наградой</text><text x="583" y="649" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Дождись подтверждения.</text><text x="583" y="677" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Повторно оплачивать не нужно.</text><rect x="583" y="724" width="434" height="56" rx="4" fill="#202623" stroke="#3b4540" opacity="1"/><text x="605" y="759" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#f5f7f4" >К ИСТОРИИ ПОКУПОК</text><text x="982" y="759" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#f5f7f4" >›</text><text x="1080" y="515" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#a8b7af" >06 / НАГРАДА ПОЛУЧЕНА</text><rect x="1080" y="532" width="480" height="276" rx="6" fill="#202623" stroke="#3b4540" opacity="1"/><circle cx="1112" cy="565" r="8" fill="#e5ff58" stroke="none" stroke-width="1"/><text x="1135" y="573" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f7f4" >Твоя награда: Машина 02</text><text x="1103" y="621" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Кристалл открыт.</text><text x="1103" y="649" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Машина добавлена в гараж.</text><text x="1103" y="677" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a8b7af" >Мощность машины: 460</text><rect x="1103" y="724" width="434" height="56" rx="4" fill="#e5ff58" stroke="none" opacity="1"/><text x="1125" y="759" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#131715" >ПЕРЕЙТИ В ГАРАЖ</text><text x="1502" y="759" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#131715" >›</text><text x="40" y="860" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#64e3db" >10 / UI STATES</text><text x="1560" y="860" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#a8b7af" text-anchor="end">Текст и значения: проект интерфейса</text></svg>