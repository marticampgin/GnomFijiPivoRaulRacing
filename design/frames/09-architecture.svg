<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900"><title>Архитектура: браузер, сервисы, гонка</title><defs><linearGradient id="shade"><stop stop-color="#0d1613" stop-opacity=".97"/><stop offset=".6" stop-color="#0d1613" stop-opacity=".42"/><stop offset="1" stop-color="#0d1613" stop-opacity="0"/></linearGradient><linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#131715" stop-opacity="0"/><stop offset="1" stop-color="#131715"/></linearGradient></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="#131715" stroke="none" opacity="1"/><text x="40" y="64" font-family="Arial, sans-serif" font-size="23" font-weight="900" fill="#e5ff58" >GNOM FIJI</text><text x="40" y="128" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#f5f7f4" >АРХИТЕКТУРА GODOT WEB</text><rect x="1088" y="92" width="465" height="28" rx="2" fill="#64e3db" stroke="none" opacity="0.13"/><text x="1100" y="112" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#64e3db" >ТЕХНИЧЕСКИЕ РЕШЕНИЯ: ПРОЕКТ</text><text x="40" y="168" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#a8b7af" >Клиент отображает и предсказывает. Сервер подтверждает гонки, прогресс и покупки.</text><rect x="40" y="230" width="450" height="250" rx="4" fill="#202623" stroke="#3b4540" opacity="1"/><rect x="58" y="247" width="67" height="28" rx="2" fill="#64e3db" stroke="none" opacity="0.13"/><text x="70" y="267" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#64e3db" >01</text><text x="58" y="310" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f5f7f4" >Godot Web · Браузер</text><text x="58" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b7af" >Ввод: клавиатура / геймпад / touch</text><text x="58" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b7af" >UI · локальное предсказание</text><text x="58" y="399" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b7af" >Сетевое состояние · локализация</text><text x="58" y="426" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b7af" >Не подтверждает награды и покупки</text><rect x="555" y="230" width="450" height="250" rx="4" fill="#202623" stroke="#3b4540" opacity="1"/><rect x="573" y="247" width="67" height="28" rx="2" fill="#64e3db" stroke="none" opacity="0.13"/><text x="585" y="267" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#64e3db" >02</text><text x="573" y="310" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f5f7f4" >Meta API</text><text x="573" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b7af" >Аккаунты · инвентарь · экономика</text><text x="573" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b7af" >Рейтинг · подбор · комнаты</text><text x="573" y="399" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b7af" >Выдача сессии и прав участия</text><text x="573" y="426" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b7af" >Проверка идемпотентности операций</text><rect x="1070" y="230" width="490" height="250" rx="4" fill="#202623" stroke="#3b4540" opacity="1"/><rect x="1088" y="247" width="67" height="28" rx="2" fill="#64e3db" stroke="none" opacity="0.13"/><text x="1100" y="267" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#64e3db" >03</text><text x="1088" y="310" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f5f7f4" >PostgreSQL</text><text x="1088" y="345" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b7af" >Профиль · детали · рейтинг</text><text x="1088" y="372" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#a8b7af" >Журнал покупок и выдачи